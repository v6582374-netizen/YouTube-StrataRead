name: Edison CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[dev,messaging,bedrock,browser]'
      # The imported host retains its upstream style; lint the integration boundary.
      - run: ruff check src/youtube_strataread/workbench coworker/server/youtube.py tests/test_edison_youtube.py
      - run: pytest -q
  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: surfaces/gui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- youtube.spec.ts
